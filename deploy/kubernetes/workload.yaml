apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudpilot-workload
  namespace: cloudpilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudpilot-workload
  template:
    metadata:
      labels:
        app: cloudpilot-workload
    spec:
      containers:
        - name: workload
          image: cloudpilot/workload:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          env:
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4318" }
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet: { path: /healthz, port: 8001 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8001 }
            initialDelaySeconds: 8
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: workload
  namespace: cloudpilot
spec:
  selector:
    app: cloudpilot-workload
  ports:
    - name: http
      port: 8001
      targetPort: 8001
