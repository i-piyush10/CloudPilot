apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: cloudpilot
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: workload
        static_configs:
          - targets: ["workload:8001"]
      - job_name: cloudpilot
        static_configs:
          - targets: ["control-plane:8000"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: cloudpilot
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.13.1
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=6h"]
          ports: [{ containerPort: 9090 }]
          resources:
            requests: { cpu: 100m, memory: 180Mi }
            limits: { cpu: 500m, memory: 500Mi }
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap: { name: prometheus-config }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: cloudpilot
spec:
  selector: { app: prometheus }
  ports: [{ port: 9090, targetPort: 9090 }]
