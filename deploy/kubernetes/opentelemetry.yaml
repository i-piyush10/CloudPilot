apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: cloudpilot
data:
  config.yml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 2s
        limit_mib: 128
      batch:
        timeout: 5s
    exporters:
      debug:
        verbosity: basic
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: cloudpilot
spec:
  replicas: 1
  selector:
    matchLabels: { app: otel-collector }
  template:
    metadata:
      labels: { app: otel-collector }
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.135.0
          args: ["--config=/etc/otelcol/config.yml"]
          ports: [{ containerPort: 4318 }]
          resources:
            requests: { cpu: 40m, memory: 80Mi }
            limits: { cpu: 250m, memory: 192Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/otelcol/config.yml, subPath: config.yml }
      volumes:
        - name: config
          configMap: { name: otel-collector-config }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: cloudpilot
spec:
  selector: { app: otel-collector }
  ports: [{ port: 4318, targetPort: 4318 }]
