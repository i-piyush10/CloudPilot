server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://control-plane:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /healthz {
    proxy_pass http://control-plane:8000/healthz;
  }

  location / {
    try_files $uri /index.html;
  }
}

